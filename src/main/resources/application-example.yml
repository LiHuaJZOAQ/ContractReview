spring:
  datasource:
    url: jdbc:mysql://localhost:3306/contract_review?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_ROOT_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    listener:
      simple:
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

  ai:
    openai:
      base-url: ${LLM_API_BASE_URL:https://your-api-address/v1}
      api-key: ${LLM_API_KEY:sk-your-api-key-here}
      embedding:
        # 如果使用独立的embedding API （比如Ollama等），可以使用下面的配置
        base-url: http://localhost:11434/v1
        api-key: "none"
        # 指定embedding模型
        options:
          model: text-embedding-3-small
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
    vectorstore:
      chroma:
        host: ${CHROMA_HOST:http://localhost:8000}

minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: contract-files

logging:
  level:
    com.contractreview: debug
