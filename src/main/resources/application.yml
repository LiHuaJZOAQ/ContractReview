spring:
  application:
    name: contract-review
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  ai:
    vectorstore:
      chroma:
        host: ${CHROMA_HOST:http://localhost:8000}
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{userId:-}]"

jwt:
  secret: ${JWT_SECRET:ContractReviewSecretKeyForJWT2026VeryLongString}
  access-token-expiration: 7200000
  refresh-token-expiration: 2592000000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

contract:
  rate-limit:
    max-per-minute: 30
  review:
    max-retry-count: 3
    desensitize:
      enable: true
    law:
      seed-enabled: true
    rag:
      similarity-threshold: 0.75
      network-cache-ttl-days: 7
      timeout-seconds:
        parsing: 30
        retrieving: 30
        reviewing: 120
        summarizing: 30
